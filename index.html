</head>
<body>

              <span class="navbar-toggler-icon"></span>

<style>

<div class="container mt-4 py-4">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="bg-white p-3 rounded shadow">
              <h2>Student Information Form</h2>

  <form action="#" method="POST">
    <label for="fullname">First Name:</label><br>
    <input type="text" id="fullname" name="fullname" required><br><br>

    <label for="studentid">Last Name:</label><br>
    <input type="text" id="studentid" name="studentid" required><br><br>

    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="Other">
    <label for="other">Other</label><br><br>

    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="course">Grade Level:</label><br>
    <select id="course" name="course">
      <option value="JC">Junior Casa</option>
      <option value="JAC">Junior Advanced Casa</option>
      <option value="g1">Grade 1</option>
      <option value="g2">Grade 2</option>
      <option value="g3">Grade 3</option>
      <option value="g4">Grade 4</option>
      <option value="g5">Grade 5</option>
      <option value="g6">Grade 6</option>
      <option value="g7">Grade 7</option>
      <option value="g8">Grade 8</option>
      <option value="g9">Grade 9</option>
      <option value="g10">Grade 10</option>
      <option value="g11">Grade 11</option>
      <option value="g12">Grade 12</option>
    </select><br><br>
  

    <label for="address">Contact Number:</label><br>
    <textarea id="address" name="address" rows="3" cols="30"></textarea><br><br>

    <button type="submit">Submit</button>
    <button type="reset">Clear Form</button>
            
    </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
